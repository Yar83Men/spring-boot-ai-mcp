spring:
  main:
    banner-mode: off
  application:
    name: spring-ai-mcp-server
  ai:
    openai:
      api-key: ${OPEN_AI_KEY}
    mcp:
      server:
        name: mcp-sse-server
        version: 1.0.0
        protocol: SSE
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

server:
  port: 8090

weather:
  api-url: api.openweathermap.org
  api-path: /data/2.5/weather
  api-key: ${WEATHER_API_KEY}

gmail:
  host: imap.gmail.com
  port: 993
  user: ${GMAIL_USER}
  password: ${GMAIL_APP_PASSWORD}


